version: "2"
sql:
  - engine: "postgresql"
    # Схема берётся из миграций (единый источник истины). sqlc распознаёт формат
    # golang-migrate по именам *.up.sql / *.down.sql и применяет только up.
    schema: "migrations"
    queries:
      - "internal/auth/queries.sql"
      - "internal/workspaces/queries.sql"
      - "internal/forms/queries.sql"
      - "internal/submissions/queries.sql"
      - "internal/visits/queries.sql"
      - "internal/mail/queries.sql"
      - "internal/entitlements/queries.sql"
      - "internal/answerfiles/queries.sql"
      - "internal/integrations/queries.sql"
      - "internal/booking/queries.sql"
      - "internal/templates/queries.sql"
      - "internal/notify/queries.sql"
    gen:
      go:
        # Сгенерированный код централизован в internal/postgres (ARCHITECTURE §4.2).
        package: "postgres"
        out: "internal/postgres"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
