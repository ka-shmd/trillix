# Dev-контур: Postgres + MinIO (S3-совместимое хранилище медиа). API и фронты
# запускаются на хосте (go run / vite), поэтому их тут нет. Порты биндятся на
# 127.0.0.1 — наружу не смотрят. Запуск: docker compose --env-file .env -f compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO — локальное S3-совместимое хранилище картинок. Тег совпадает с тем, что
  # тянет интеграционный тест blob (проверен). Порт API 9000, консоль 9001.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Одноразовый бутстрап бакета: создаёт app-media и выставляет public-read БЕЗ
  # листинга (mc anonymous download = только GetObject). Отрабатывает и выходит.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      S3_FILES_BUCKET: ${S3_FILES_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do echo 'ждём minio...'; sleep 1; done;
      mc mb --ignore-existing local/$${S3_MEDIA_BUCKET};
      mc anonymous set download local/$${S3_MEDIA_BUCKET};
      mc mb --ignore-existing local/$${S3_FILES_BUCKET};
      echo 'бакет готов';
      "

  # Сервис печати PDF (ADR §10). В dev он есть, потому что иначе печать нельзя
  # посмотреть вовсе: chromium в api-образ не кладётся, а на хосте его у нас нет.
  # Образ собирается локально из того же Dockerfile, что уедет на прод.
  #
  # network_mode: host — dev-особенность, и единственная возможная: api и фронты
  # живут НА ХОСТЕ (go run / vite), а принтеру нужно ходить к api за печатной
  # страницей, api — к принтеру за документом. В прод-контуре оба в одной сети
  # compose, и хостовая сеть там не нужна (deploy/compose.prod.yml).
  printer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.printer
    image: ghcr.io/ka-shmd/trillix-printer:latest
    environment:
      PRINTER_API_ORIGIN: http://127.0.0.1:8080
    network_mode: host
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
