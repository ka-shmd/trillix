<!doctype html>
<!-- data-form-shell — вторая точка вставки для Go (первая — плейсхолдер og-меты
     в head ниже; назвать его здесь нельзя — вложенных комментариев в HTML нет, да и
     Go нашёл бы это упоминание раньше настоящего). Атрибут целиком заменяется на
     class="rf-theme-dark …" style="--rf-…" из снапшота формы, чтобы тёмная форма
     была тёмной С ПЕРВОГО КАДРА: рендерер это SPA, схема
     приезжает вторым запросом, и до неё страница мигала бы белой. Форма без
     оформления не получает ни класса, ни стиля — атрибут просто исчезает.
     НЕ УДАЛЯТЬ: api читает его при старте и падает fail-fast, как без og-меты.
     В dev (страницу отдаёт vite) атрибут остаётся в разметке как есть — он пустой и
     ни на что не влияет, тему там надевает клиент после загрузки схемы. -->
<html lang="ru" data-form-shell>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--og-meta-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
