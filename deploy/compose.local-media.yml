# Override поверх compose.prod.yml: локальное хранилище медиа для контура prod-local.
# Подключается вторым файлом и только там (PROD_COMPOSE в Makefile):
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.local-media.yml up -d
#
# Зачем отдельным файлом, а не сервисами в прод-файле: на реальном проде хранилище
# арендованное (S3_* + MEDIA_UPSTREAM/_HOST в env), и MinIO там не существует вовсе.
# Держать его в прод-файле значило бы описывать сервисы, которые прод никогда не
# поднимает. Общие сервисы (api, caddy, postgres, migrate) живут только в базовом
# файле и не дублируются — расходиться между контурами нечему.
#
# api от этих сервисов НЕ зависит (см. depends_on в базовом файле): приложение не
# подключается к S3 на старте, недоступное хранилище роняет только загрузку картинок.

services:
  # MinIO — S3-совместимое хранилище медиа. Порт наружу НЕ публикуется: доступен
  # только по внутренней docker-сети (api ходит на http://minio:9000; раздача
  # картинок наружу — через Caddy /media).
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Одноразовый бутстрап бакета: public-read БЕЗ листинга (mc anonymous download =
  # только GetObject). Отрабатывает и выходит. Аналог этого на проде — открыть бакет
  # на чтение в панели S3-провайдера (иначе 403 на раздаче при рабочей загрузке).
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/$${S3_MEDIA_BUCKET};
      mc anonymous set download local/$${S3_MEDIA_BUCKET};
      "
    restart: "no"

volumes:
  minio_data:
