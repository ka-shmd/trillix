# Прод-контур (Фаза 7). Этот файл описывает РОВНО то, что работает на настоящем
# проде, и он же — база для prod-local (на *.localhost с локальным CA Caddy):
# различия контуров живут в env-файле, а не в ветвлениях внутри файла.
#
# Единственное, чего на проде нет, — локальное хранилище медиа: там S3 арендованный.
# Поэтому MinIO вынесен в отдельный override `compose.local-media.yml`, который
# подключается ТОЛЬКО в prod-local (см. PROD_COMPOSE в Makefile):
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.local-media.yml up -d
# Так прод-файл не содержит сервисов, которые на проде никогда не запускаются,
# а общие сервисы описаны один раз — расходиться между контурами нечему.
#
# Запуск прода: docker compose --env-file .env -f deploy/compose.prod.yml up -d
# (обычно через deploy/remote-update.sh из CD). Указанный --env-file — единственный
# источник: из него идут и подстановки ${...} ниже, и окружение контейнеров
# api/migrate (через environment-якорь).

# Окружение приложения (api и одноразовый migrate — один бинарник, config.Load()
# требует полный набор даже для `migrate up`). Значения берутся из --env-file через
# подстановку — так контейнер получает ровно тот контур, что указан при запуске,
# без риска подхватить чужой env_file.
x-app-env: &app-env
  HTTP_ADDR: ${HTTP_ADDR}
  LOG_LEVEL: ${LOG_LEVEL}
  DATABASE_URL: ${DATABASE_URL}
  COOKIE_SECURE: ${COOKIE_SECURE}
  FORM_TOKEN_SECRET: ${FORM_TOKEN_SECRET}
  PUBLIC_RENDERER_BASE_URL: ${PUBLIC_RENDERER_BASE_URL}
  OG_IMAGE_URL: ${OG_IMAGE_URL}
  PUBLIC_RENDERER_INDEX_PATH: ${PUBLIC_RENDERER_INDEX_PATH:-} # опциональна (пусто в dev)
  APP_ORIGIN: ${APP_ORIGIN}
  # За Caddy честный IP клиента берётся из X-Forwarded-For (TD-1) — в прод-контуре
  # всегда true. config.Load() требует переменную, поэтому без неё падает и migrate.
  TRUSTED_PROXY: ${TRUSTED_PROXY}
  # Справочник геолокации. ОПЦИОНАЛЬНАЯ (`:-`): контур без файла работает, блок
  # стран и городов не рисуется. Файл не в образе — он в томе geo (см. volumes).
  GEO_DB_PATH: ${GEO_DB_PATH:-}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
  S3_FILES_BUCKET: ${S3_FILES_BUCKET}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_PATH_STYLE: ${S3_PATH_STYLE}
  # Исходящая почта (почтовая фаза). Обязательные: config.Load() без них падает.
  MAIL_TRANSPORT: ${MAIL_TRANSPORT}
  MAIL_FROM: ${MAIL_FROM}
  # Параметры SMTP-транспорта (слайс E). ОПЦИОНАЛЬНЫЕ на уровне якоря (`:-`): нужны
  # только при MAIL_TRANSPORT=smtp — тогда их требует config.Load(). prod-local → Mailpit,
  # прод → Postbox. Пароль — секрет, живёт только в env-файле контура (инвариант 7).
  MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
  MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
  MAIL_SMTP_TLS: ${MAIL_SMTP_TLS:-}
  MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
  MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
  # Вход через Яндекс ID (фаза 11). ОПЦИОНАЛЬНЫЕ, поэтому с `:-`: контур без
  # своего приложения провайдера поднимается без них, кнопка просто не рисуется.
  # Список выше — поимённый (см. комментарий к якорю), поэтому переменная, не
  # добавленная сюда, не доезжает до контейнера, сколько её ни клади в .env.
  YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:-}
  YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
  # Сервис печати PDF (ADR §10). ОПЦИОНАЛЬНАЯ (`:-`): контур без принтера
  # поднимается, кнопка «Скачать PDF» отвечает 503 «печать не настроена».
  PRINTER_URL: ${PRINTER_URL:-}
  # Печатная страница ответа — в той же смонтированной статике рендерера, что и
  # index.html. ОПЦИОНАЛЬНА (`:-`): пусто — печати на контуре нет.
  PRINT_PAGE_PATH: ${PRINT_PAGE_PATH:-}
  # Генерация и правка формы текстом (фаза 26). ОПЦИОНАЛЬНЫЕ (`:-`): контур без
  # провайдера модели поднимается, ручки генерации отвечают 404. AI_API_KEY —
  # секрет, живёт только в env-файле контура (инвариант 7).
  AI_TRANSPORT: ${AI_TRANSPORT:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_PROJECT: ${AI_PROJECT:-}
  AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}

# Окружение сервиса печати. Свой якорь, а не общий с api: принтеру не положено
# знать ни DSN базы, ни секретов — он умеет ровно одно, запускать браузер. Пустой
# набор здесь был бы честнее только на словах: дефолты живут в config.LoadPrinter,
# а переменные нужны, чтобы контур мог их переопределить не пересобирая образ.
x-printer-env: &printer-env
  PRINTER_ADDR: ${PRINTER_ADDR:-:8090}
  PRINTER_API_ORIGIN: ${PRINTER_API_ORIGIN:-http://api:8080}
  CHROMIUM_BIN: ${CHROMIUM_BIN:-chromium}

# Ротация docker-логов (фаза 10, шаг 4). Без неё json-file-логи растут безгранично и
# со временем забивают диск VPS — Postgres перестаёт писать, прод ложится, причём
# молча. Потолок на контейнер — max-file × max-size = 50 МиБ, старое вытесняется.
# Применяется при ПЕРЕСОЗДАНИИ контейнера (`up -d` на деплое), не на лету.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Порт наружу НЕ публикуется: база доступна только по внутренней docker-сети
    # (инвариант харденинга — ARCHITECTURE §6.5).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Одноразовый прогон миграций тем же образом, что и api (миграции встроены в
  # бинарник через go:embed). Гейт для api: тот стартует только после успешного
  # завершения этого сервиса, поэтому схема всегда актуальна до первого запроса.
  migrate:
    image: ghcr.io/ka-shmd/trillix-api:${TAG:-latest}
    logging: *logging
    command: ["migrate", "up"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/ka-shmd/trillix-api:${TAG:-latest}
    logging: *logging
    environment: *app-env
    volumes:
      # Собранный index.html рендерера read-only: Go читает его при старте и отдаёт
      # как страницу формы /r/{slug} (PUBLIC_RENDERER_INDEX_PATH). Тот же том раздаёт
      # Caddy (renderer-статика), поэтому index.html и ассеты всегда из одной сборки —
      # рассинхрон невозможен. Статика раскладывается build-static.sh до `up` (Makefile).
      - ./static/renderer:/srv/renderer:ro
      # Справочник геолокации read-only. Монтируем КАТАЛОГ, а не файл — по той же
      # причине, что и Caddyfile ниже: bind-mount одиночного файла привязан к иноде,
      # и подмена файла новой версией справочника осталась бы невидимой контейнеру.
      # Каталога может не быть вовсе: тогда GEO_DB_PATH пуст и гео не показывается.
      - ./geo:/srv/geo:ro
    # Зависимости только от того, без чего api не может стартовать. Хранилища
    # медиа среди них нет намеренно: приложение не подключается к S3 на старте
    # (недоступное хранилище роняет только загрузку картинок), а на проде MinIO
    # не существует вовсе — жёсткая зависимость мешала бы старту.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Порт наружу НЕ публикуется: наружу api смотрит только через Caddy.
    # Healthcheck внутри контейнера не ставим — distroless без shell/curl;
    # живость проверяет внешний мониторинг по /healthz (фаза 10).
    restart: unless-stopped

  # Печать PDF ответов (ADR §10). Отдельный сервис, потому что печатает
  # headless-Chromium, а он не кладётся в distroless-образ api. Состояния нет,
  # базы нет, наружу порт НЕ публикуется: к нему ходит только api по внутренней
  # сети, и он же ходит обратно за печатной страницей.
  #
  # Образ свой (deploy/Dockerfile.printer) и собирается тем же workflow, что и api.
  # Контейнер переживает падение браузера: процесс браузера запускается на документ,
  # и его смерть — это ошибка одной печати, а не сервиса.
  printer:
    image: ghcr.io/ka-shmd/trillix-printer:${TAG:-latest}
    logging: *logging
    environment: *printer-env
    # Печать поднимает браузер: /dev/shm по умолчанию 64 МБ, и на странице с
    # картинками chromium в него не помещается. Флаг --disable-dev-shm-usage в
    # сервисе уже стоит, это второй пояс.
    shm_size: 256mb
    restart: unless-stopped

  caddy:
    image: caddy:2
    logging: *logging
    environment:
      # Домены двух сайтов — Caddyfile читает их как {$APP_DOMAIN} и {$RENDERER_DOMAIN}.
      # prod-local: app.localhost / f.localhost; прод: реальные. API — same-origin
      # под {$APP_DOMAIN}/api, отдельного домена нет (ADR §10).
      APP_DOMAIN: ${APP_DOMAIN}
      RENDERER_DOMAIN: ${RENDERER_DOMAIN}
      # Бакет картинок — Caddy подставляет в rewrite /media/* → /<bucket>/*.
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      # Внешний адрес хранилища — в connect-src страницы формы: туда браузер
      # респондента кладёт файлы ответов по подписи (фаза 24).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      # Upstream раздачи /media и Host к нему: prod-local → http://minio:9000,
      # реальный прод → https://<арендованный-s3> + тот же хост в Host. Без этих
      # переменных раздача была бы захардкожена на MinIO (см. Caddyfile media).
      MEDIA_UPSTREAM: ${MEDIA_UPSTREAM}
      MEDIA_UPSTREAM_HOST: ${MEDIA_UPSTREAM_HOST}
      # Срок HSTS (TD-13): prod-local → 0 (безвредно на *.localhost), прод → 31536000.
      HSTS_MAX_AGE: ${HSTS_MAX_AGE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Монтируем КАТАЛОГ, а не файл. Одиночный bind-mount файла привязан к иноде,
      # а `git checkout` тега пишет новый файл и переименовывает — инода меняется,
      # и контейнер продолжает видеть старое содержимое. Из-за этого любая правка
      # Caddyfile молча не доезжала до прода: `caddy reload` честно перечитывал
      # устаревший файл и возвращал успех. Каталог резолвится при каждом обращении,
      # поэтому подмена файла внутри него видна (deploy/caddy/Caddyfile).
      - ./caddy:/etc/caddy:ro
      - ./static:/srv/static:ro                # deploy/static (scripts/build-static.sh)
      - caddy_data:/data                        # сертификаты локального CA / Let's Encrypt
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  caddy_data:
  caddy_config:
