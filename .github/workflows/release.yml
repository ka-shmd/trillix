name: Release

# По git-тегу v* собираем релизный комплект: Go-образ в GHCR и статику фронтов
# артефактом к GitHub Release, затем автодеплоим на прод по SSH (job deploy, фаза 9
# шаг 5). Сервер тянет готовое сам («скачать готовое», а не «собрать на сервере»).
on:
  push:
    tags: ['v*']

# Образ пушится в GHCR (packages), Release создаётся (contents).
permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Go-образы → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Кеш слоёв между релизами. Без него каждая сборка идёт с нуля, и слой
      # установки пакетов пересоздаётся с новыми метаданными apt — digest другой,
      # и прод тянет его целиком на КАЖДЫЙ тег. У образа печати это ~800 МБ
      # (chromium и его десктопная обвязка), у api — десятки мегабайт. С кешем
      # неизменившийся слой переиспользуется, и выкатка везёт только бинарь.
      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          # Тег образа = git-тег (напр. v0.7.0). compose.prod.yml на VPS подставит
          # его через ${TAG} и сделает docker compose pull (фаза 9).
          tags: ghcr.io/${{ github.repository_owner }}/trillix-api:${{ github.ref_name }}
      # Второй образ — сервис печати PDF (ADR §10): headless-Chromium не кладётся в
      # distroless-образ api, поэтому у него свой Dockerfile и свой тег. Собирается
      # тем же тегом, что api: compose на сервере подставляет один ${TAG} обоим, и
      # разъехаться версиям нечем.
      - name: build & push printer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.printer
          push: true
          # Своя область кеша: у образов разные базы, общий scope затирал бы слои
          # одного другим на каждой сборке.
          cache-from: type=gha,scope=printer
          cache-to: type=gha,scope=printer,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/trillix-printer:${{ github.ref_name }}

  static:
    name: Статика фронтов → GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build static
        env:
          # База публичной части печётся в бандл кабинета на этапе сборки. Реальный
          # домен появится в фазе 9 — тогда выставить repo-переменную
          # VITE_PUBLIC_BASE_URL. До этого — заглушка (артефакт технически валиден,
          # но ссылка на форму указывает на example.com).
          VITE_PUBLIC_BASE_URL: ${{ vars.VITE_PUBLIC_BASE_URL || 'https://f.example.com' }}
        run: |
          if [ -z "${{ vars.VITE_PUBLIC_BASE_URL }}" ]; then
            echo "::warning::vars.VITE_PUBLIC_BASE_URL не задан — статика собрана с заглушкой https://f.example.com (задать в фазе 9)"
          fi
          ./scripts/build-static.sh
      - name: package
        # Тарболл повторяет раскладку deploy/static/{app,renderer} — её же rsync'ит
        # на сервер деплой фазы 9.
        run: tar -czf trillix-static-${{ github.ref_name }}.tar.gz -C deploy/static .
      - name: attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: trillix-static-${{ github.ref_name }}.tar.gz
          generate_release_notes: true

  # Автодеплой на прод по SSH (фаза 9, шаг 5). Ждёт готовый образ (GHCR) и статику
  # (Release), затем заходит на сервер и запускает обновление до этого тега. Деплой
  # делает сам сервер (тянет образ/статику своими кредами) — CI только его триггерит.
  deploy:
    name: Деплой на прод по SSH
    needs: [image, static]
    runs-on: ubuntu-latest
    # Своя группа, НЕ зависящая от тега: workflow-level concurrency выше ключуется
    # на github.ref, поэтому два разных тега (v0.9.5 и v0.9.6) попадали бы в разные
    # группы и могли выполнять remote-update.sh на ОДНОМ сервере параллельно —
    # конкурирующие git checkout в одном каталоге и одновременный compose up.
    # Сборкам параллелиться можно (они независимы), деплою — нет.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: SSH-ключ и known_hosts
        # Приватный ключ деплой-пользователя — из секрета; хост доверяем по ssh-keyscan.
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Обновить прод до ${{ github.ref_name }}
        # Прокидываем скрипт обновления на сервер; TAG — в окружении удалённого bash.
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "TAG='${{ github.ref_name }}' bash -s" < deploy/remote-update.sh
