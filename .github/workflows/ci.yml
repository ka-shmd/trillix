name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Отменять устаревшие прогоны на том же ref, чтобы не жечь минуты.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          # ./... заполз бы в web/**/node_modules с посторонними .go-файлами.
          args: ./cmd/... ./internal/... ./migrations/...
      - name: sqlc drift check
        run: |
          go tool sqlc generate
          git diff --exit-code internal/postgres \
            || { echo "::error::internal/postgres устарел — запусти 'make sqlc' и закоммить"; exit 1; }
      - name: test
        # Тег integration включает интеграционные тесты против Postgres в
        # testcontainers; Docker на ubuntu-раннерах доступен из коробки.
        run: go test -race -tags=integration ./cmd/... ./internal/... ./migrations/...

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [app, renderer]
    defaults:
      run:
        working-directory: web/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        # Бюджет веса — только у рендерера (публичная форма грузится на телефоне);
        # превышение валит сборку. Кабинету бюджет не задаём.
      - name: bundle budget
        if: matrix.project == 'renderer'
        run: npm run check:bundle
