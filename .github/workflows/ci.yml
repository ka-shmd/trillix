name: CI (docs)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Отменять устаревшие прогоны на том же ref, чтобы не жечь минуты.
concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Расхождения документов с кодом раньше регистрировались в TECH-DEBT §4 вместо
  # того, чтобы чиниться, — и реестр сам протух. Джоба лёгкая (секунды, без
  # тулчейнов) и гоняется на ЛЮБОЕ изменение, включая docs-only: она ловит и
  # правки-под-код (дерево модулей, миграции, env), и битые ссылки на техдолг в
  # самих доках. Тяжёлые проверки (Go, фронты, Lighthouse) — в ci-code.yml, и на
  # docs-only изменениях НЕ запускаются (там path-фильтр).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-docs
        run: ./scripts/check-docs.sh
